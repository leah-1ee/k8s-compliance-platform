# kube-prometheus-stack values
# 학교 클라우드의 제한된 worker CPU 환경에 맞춘 모니터링 설정

alertmanager:
  # 실험 환경 알림 컴포넌트 제외
  enabled: false

prometheusOperator:
  # Operator 리소스 절감
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheusConfigReloader:
    # 설정 리로더 리소스 절감
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    # Prometheus 리소스 절감
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

kube-state-metrics:
  # 상태 메트릭 리소스 절감
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

grafana:
  enabled: true
  replicas: 1

  # Grafana를 2코어 worker 노드에 배치
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1

  # Grafana 본 컨테이너 리소스
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # 임시 저장소 사용
  persistence:
    enabled: false

  # ai-server /grafana-ui 프록시가 전달하는 사용자 헤더를 신뢰한다.
  grafana.ini:
    auth.proxy:
      enabled: true
      header_name: X-WEBAUTH-USER
      header_property: email
      auto_sign_up: true
      sync_ttl: 60
      headers: "Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME"

  sidecar:
    # sidecar 공통 리소스
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      # dashboard sidecar 리소스
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    datasources:
      # datasource sidecar 리소스
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
