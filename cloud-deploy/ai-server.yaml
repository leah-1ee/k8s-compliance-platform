apiVersion: v1
kind: Namespace
metadata:
  name: compliance-system
  labels:
    app.kubernetes.io/part-of: compliance-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-ai-classifier
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-ai-classifier
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-ai-classifier
subjects:
  - kind: ServiceAccount
    name: ai-classifier
    namespace: compliance-system

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-classifier-admin
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
type: Opaque
stringData:
  ADMIN_TOKEN: "change-me-before-deploy"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-classifier-data
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-classifier
  template:
    metadata:
      labels:
        app: ai-classifier
        app.kubernetes.io/part-of: compliance-platform
    spec:
      serviceAccountName: ai-classifier
      containers:
        - name: ai-classifier
          image: leeon3345/compliance-ai-server:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RESPONSE_SERVER_URL
              value: "http://response-server.compliance-system.svc.cluster.local:5000"
            - name: CLUSTER_NAME
              value: "school-cloud"
            - name: PUBLIC_BASE_URL
              value: "https://compliance-ai-console.shares.zrok.io"
            - name: SQLITE_PATH
              value: "/data/compliance-ai-server.sqlite3"
            - name: DEMO_CLUSTER_NAMES
              value: "school-cloud,boanlab-cloud"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-classifier-admin
                  key: ADMIN_TOKEN
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-google-oauth
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-google-oauth
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ai-classifier-data
              mountPath: /data
      volumes:
        - name: ai-classifier-data
          persistentVolumeClaim:
            claimName: ai-classifier-data

---
apiVersion: v1
kind: Service
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
spec:
  type: ClusterIP
  selector:
    app: ai-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
