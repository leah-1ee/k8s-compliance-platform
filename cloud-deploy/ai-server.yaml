apiVersion: v1
kind: Namespace
metadata:
  name: compliance-system
  labels:
    app.kubernetes.io/part-of: compliance-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-ai-classifier
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-ai-classifier
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-ai-classifier
subjects:
  - kind: ServiceAccount
    name: ai-classifier
    namespace: compliance-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-classifier
  template:
    metadata:
      labels:
        app: ai-classifier
        app.kubernetes.io/part-of: compliance-platform
    spec:
      serviceAccountName: ai-classifier
      containers:
        - name: ai-classifier
          image: leeon3345/compliance-ai-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RESPONSE_SERVER_URL
              value: "http://response-server.compliance-system.svc.cluster.local:5000"
            - name: CLUSTER_NAME
              value: "school-cloud"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: ai-classifier
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
spec:
  type: ClusterIP
  selector:
    app: ai-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
