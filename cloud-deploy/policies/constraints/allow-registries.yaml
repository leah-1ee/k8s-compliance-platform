apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allow-registries
  annotations:
    description: "허용된 컨테이너 이미지 레지스트리 prefix만 사용할 수 있습니다."
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - kube-flannel
  parameters:
    repos:
      - "docker.io/library/"
      - "gcr.io/"
      - "ghcr.io/"
      - "registry.k8s.io/"
