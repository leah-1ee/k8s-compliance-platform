apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
  annotations:
    description: "모든 컨테이너는 runAsNonRoot: true 를 명시해야 합니다."
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.runAsNonRoot == true
          msg := sprintf("컨테이너 '%v': securityContext.runAsNonRoot 가 true 로 설정되어 있지 않습니다.", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          not container.securityContext.runAsNonRoot == true
          msg := sprintf("initContainer '%v': securityContext.runAsNonRoot 가 true 로 설정되어 있지 않습니다.", [container.name])
        }
