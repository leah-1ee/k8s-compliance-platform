# Gatekeeper Helm Values
# 설치 명령어: helm install gatekeeper gatekeeper/gatekeeper -n gatekeeper-system --create-namespace -f gatekeeper-values.yaml
# 차트 버전: gatekeeper v3.14+

# 감사 주기 (초 단위) - 60초마다 기존 리소스를 정책 기준으로 재검사
auditInterval: 60

# 기본 위반 처리 방식
# - audit  : 위반 사항을 기록만 하고 리소스 생성/수정은 허용 (초기 도입 시 권장)
# - dryrun : audit과 동일하나 상태 업데이트 없음
# - deny   : 위반 시 요청 거부 (정책이 안정화된 후 전환)
#
# [deny 모드로 전환하는 법]
# 아래 defaultEnforcementAction 값을 "deny"로 변경하거나,
# 각 Constraint 리소스의 spec.enforcementAction 필드를 "deny"로 개별 설정
defaultEnforcementAction: audit

# 리소스 절약을 위해 replica 1개로 운영
replicaCount: 1

# Gatekeeper 컨트롤러 리소스 제한
controllerManager:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# 감사 컨트롤러 리소스 제한
audit:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# 위반 기록을 Constraint 상태에 저장할 최대 개수
auditChunkSize: 500

# 감사 결과를 Constraint 오브젝트 status 필드에 저장 (kubectl describe로 확인 가능)
emitAuditEvents: true

# 웹훅 요청/응답 로그 출력 여부
logLevel: INFO
