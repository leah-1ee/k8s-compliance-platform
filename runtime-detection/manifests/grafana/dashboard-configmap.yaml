# Grafana Dashboard Provisioning ConfigMap
# Applies the Runtime Detection dashboard through kube-prometheus-stack's dashboard sidecar.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-runtime-detection
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: compliance-platform
    app.kubernetes.io/component: grafana-dashboard
data:
  runtime-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Policy-as-Code Compliance Platform — Runtime Detection Dashboard",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Runtime Compliance Score",
          "description": "Overall runtime posture based on stored high-severity KubeOwl events",
          "type": "gauge",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 - (((sum(kubeowl_runtime_events_total{severity=\"high\"}) or vector(0)) / ((sum(kubeowl_runtime_events_total) or vector(0)) + 1)) * 100)",
              "legendFormat": "Score",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "yellow",
                    "value": 85
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Total Events",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kubeowl_runtime_events_total) or vector(0)",
              "legendFormat": "Total",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "HIGH Events",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 9,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kubeowl_runtime_events_total{severity=\"high\"}) or vector(0)",
              "legendFormat": "High",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Tracked Clusters",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(kubeowl_cluster_last_seen_timestamp_seconds) or vector(0)",
              "legendFormat": "Tracked",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Recent 24h Events",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 15,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kubeowl_runtime_events_recent_24h) or vector(0)",
              "legendFormat": "Recent 24h",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Last Seen Age",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 6,
            "y": 3
          },
          "targets": [
            {
              "expr": "time() - max(kubeowl_cluster_last_seen_timestamp_seconds)",
              "legendFormat": "Seconds since last event",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "s"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Clusters Reporting",
          "type": "stat",
          "gridPos": {
            "h": 3,
            "w": 3,
            "x": 9,
            "y": 3
          },
          "targets": [
            {
              "expr": "count(kubeowl_cluster_last_seen_timestamp_seconds) or vector(0)",
              "legendFormat": "Reporting",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Events by Severity Over Time",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(kubeowl_runtime_events_total{severity=\"high\"}) or vector(0)",
              "legendFormat": "High",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(kubeowl_runtime_events_total{severity=\"medium\"}) or vector(0)",
              "legendFormat": "Medium",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(kubeowl_runtime_events_total{severity=\"low\"}) or vector(0)",
              "legendFormat": "Low",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "High"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Medium"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Low"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Events by Cluster and Severity",
          "type": "barchart",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum by (cluster_name, severity) (kubeowl_runtime_events_total)",
              "legendFormat": "{{cluster_name}} {{severity}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Reporting Clusters",
          "type": "piechart",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "expr": "count by (cluster_name) (kubeowl_cluster_last_seen_timestamp_seconds)",
              "legendFormat": "{{cluster_name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Events by Source",
          "type": "piechart",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 14
          },
          "targets": [
            {
              "expr": "sum by (source) (kubeowl_runtime_events_total)",
              "legendFormat": "{{source}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Last Seen by Cluster",
          "type": "barchart",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "expr": "kubeowl_cluster_last_seen_timestamp_seconds",
              "legendFormat": "{{cluster_name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso"
            }
          }
        },
        {
          "title": "Stored Events by Severity",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 14
          },
          "targets": [
            {
              "expr": "sum by (severity) (kubeowl_runtime_events_total)",
              "legendFormat": "{{severity}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "title": "Runtime Events by Severity",
          "description": "Stored KubeOwl runtime events grouped by severity",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "expr": "sum by (severity) (kubeowl_runtime_events_total)",
              "legendFormat": "{{severity}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "severity": "Severity",
                  "Value": "Total Events"
                }
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Webhook Security",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          }
        },
        {
          "title": "HMAC Mode",
          "description": "1 = hard(필수), 0 = soft(선택). 프로덕션에서는 반드시 1이어야 합니다.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "expr": "compliance_hmac_mode or vector(0)",
              "legendFormat": "{{mode}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "SOFT (취약)",
                      "color": "red"
                    },
                    "1": {
                      "text": "HARD (안전)",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "총 거부 요청 수",
          "description": "보안 미들웨어가 차단한 웹훅 요청 누적 수",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 31
          },
          "targets": [
            {
              "expr": "sum(compliance_webhook_rejected_by_reason_total) or vector(0)",
              "legendFormat": "Rejected",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "HMAC 인증 실패 수",
          "description": "서명 불일치 또는 타임스탬프 초과로 거부된 요청",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 31
          },
          "targets": [
            {
              "expr": "sum(compliance_webhook_rejected_by_reason_total{reason=\"hmac_failed\"}) or vector(0)",
              "legendFormat": "HMAC 실패",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "IP 차단 / Rate Limit",
          "description": "IP 화이트리스트 차단(403) 및 속도 초과(429) 요청",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "expr": "(sum(compliance_webhook_rejected_by_reason_total{reason=\"ip_blocked\"}) or vector(0)) + (sum(compliance_webhook_rejected_by_reason_total{reason=\"rate_limited\"}) or vector(0))",
              "legendFormat": "IP차단+속도초과",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "바디 크기 초과 (DoS 시도)",
          "description": "1MB 상한을 초과한 요청 (HMAC 검증 전 조기 차단)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 31
          },
          "targets": [
            {
              "expr": "sum(compliance_webhook_rejected_by_reason_total{reason=\"body_too_large\"}) or vector(0)",
              "legendFormat": "바디 초과",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "사유별 거부 건수 (누적)",
          "description": "보안 사유별 거부 요청 분포",
          "type": "piechart",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "expr": "compliance_webhook_rejected_by_reason_total",
              "legendFormat": "{{reason}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "hmac_failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "ip_blocked"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rate_limited"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "yellow",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "body_too_large"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "purple",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "pieType": "donut",
            "displayLabels": [
              "name",
              "percent"
            ]
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "웹훅 거부 시계열 (사유별 초당 발생률)",
          "description": "공격 패턴 추적 — 급격한 증가는 진행 중인 공격을 의미",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 18,
            "x": 6,
            "y": 35
          },
          "targets": [
            {
              "expr": "rate(compliance_webhook_rejected_by_reason_total{reason=\"hmac_failed\"}[2m])",
              "legendFormat": "HMAC 실패",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "rate(compliance_webhook_rejected_by_reason_total{reason=\"ip_blocked\"}[2m])",
              "legendFormat": "IP 차단",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "rate(compliance_webhook_rejected_by_reason_total{reason=\"rate_limited\"}[2m])",
              "legendFormat": "Rate Limit",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "rate(compliance_webhook_rejected_by_reason_total{reason=\"body_too_large\"}[2m])",
              "legendFormat": "바디 초과",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "HMAC 실패"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
