apiVersion: v1
kind: Namespace
metadata:
  name: runtime-demo
  labels:
    purpose: compliance-runtime-demo

---
apiVersion: v1
kind: Pod
metadata:
  name: runtime-demo-target
  namespace: runtime-demo
  labels:
    app: runtime-demo-target
    tier: demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
