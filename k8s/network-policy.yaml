apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-deny-all-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow-ai-server-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compliance-system
          podSelector:
            matchLabels:
              app: ai-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compliance-system
          podSelector:
            matchLabels:
              app: ai-classifier
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-deny-all-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow-ai-server-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compliance-system
          podSelector:
            matchLabels:
              app: ai-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compliance-system
          podSelector:
            matchLabels:
              app: ai-classifier
      ports:
        - protocol: TCP
          port: 3000
