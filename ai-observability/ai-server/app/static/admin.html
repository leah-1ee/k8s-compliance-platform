<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compliance Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111820;
        --panel: #151f29;
        --line: #304050;
        --text: #e5edf6;
        --muted: #9aa8b8;
        --accent: #58a6ff;
        --danger: #ff6b6b;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--line);
      }
      main {
        display: grid;
        gap: 20px;
        padding: 28px 32px 48px;
      }
      section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px;
      }
      h1, h2 {
        margin: 0;
      }
      h1 {
        font-size: 28px;
      }
      h2 {
        margin-bottom: 16px;
        font-size: 20px;
      }
      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-weight: 700;
      }
      input, select, textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0c1218;
        color: var(--text);
        padding: 12px;
        font: inherit;
      }
      textarea {
        min-height: 180px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        resize: vertical;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #1d2a37;
        color: var(--text);
        padding: 10px 14px;
        font-weight: 800;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #07111c;
        border-color: var(--accent);
      }
      button.danger {
        border-color: rgba(255, 107, 107, 0.6);
        color: #ffdada;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      .row label {
        flex: 1 1 280px;
      }
      .cluster {
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .cluster:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .summary-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c1218;
        padding: 14px;
      }
      .summary-card strong {
        display: block;
        margin-top: 6px;
        font-size: 24px;
      }
      .user {
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .user:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .user-clusters {
        display: grid;
        gap: 8px;
      }
      .user-cluster {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c1218;
        padding: 10px 12px;
      }
      .meta {
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .status-active {
        color: #7ee787;
      }
      .status-disabled {
        color: var(--danger);
      }
      .status-deleted {
        color: #ffb86b;
      }
      .filters {
        display: grid;
        grid-template-columns: minmax(240px, 2fr) repeat(2, minmax(160px, 1fr)) auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .danger-note {
        color: #ffb86b;
        font-weight: 700;
      }
      #message {
        min-height: 24px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        .summary-grid {
          grid-template-columns: 1fr;
        }
        .filters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Compliance Admin</h1>
    </header>
    <main>
      <section>
        <h2>Admin Token</h2>
        <div class="row">
          <label>
            X-Admin-Token
            <input id="adminToken" type="password" autocomplete="off" />
          </label>
          <button class="primary" id="saveToken">저장</button>
          <button id="refreshClusters">새로고침</button>
        </div>
        <p id="message"></p>
      </section>

      <section>
        <h2>클러스터 등록</h2>
        <div class="row">
          <label>
            클러스터 이름
            <input id="clusterName" placeholder="school-cloud" />
          </label>
          <label>
            구분
            <select id="clusterKind">
              <option value="customer">사용자 클러스터</option>
              <option value="demo">데모/테스트 클러스터</option>
            </select>
          </label>
          <button class="primary" id="createCluster">등록</button>
        </div>
      </section>

      <section>
        <h2>설치 명령어</h2>
        <textarea id="installCommand" readonly placeholder="클러스터를 등록하거나 토큰을 재발급하면 여기에 Falco Sidekick 설치 명령어가 표시됩니다."></textarea>
        <div class="row">
          <button id="copyInstall">복사</button>
        </div>
      </section>

      <section>
        <h2>운영 요약</h2>
        <div class="summary-grid" id="adminSummary">
          <div class="summary-card"><span class="meta">사용자</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">클러스터</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">활성 클러스터</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">수집 이벤트</span><strong>-</strong></div>
        </div>
      </section>

      <section>
        <h2>사용자 목록</h2>
        <div id="users"></div>
      </section>

      <section>
        <h2>사용자 상세</h2>
        <div id="userDetail"><p class="meta">사용자를 선택하면 소유 클러스터, 이벤트 수, Slack 설정 상태를 확인할 수 있습니다.</p></div>
      </section>

      <section>
        <h2>클러스터 목록</h2>
        <div class="filters">
          <label>
            검색
            <input id="clusterSearch" placeholder="email, cluster, status, kind, last_seen" />
          </label>
          <label>
            상태
            <select id="statusFilter">
              <option value="">전체</option>
              <option value="active">active</option>
              <option value="disabled">disabled</option>
              <option value="deleted">deleted</option>
            </select>
          </label>
          <label>
            구분
            <select id="kindFilter">
              <option value="">전체</option>
              <option value="customer">customer</option>
              <option value="demo">demo</option>
              <option value="source">source</option>
              <option value="legacy">legacy</option>
            </select>
          </label>
          <button id="applyClusterFilters">필터 적용</button>
        </div>
        <div id="clusters"></div>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#adminToken");
      const message = document.querySelector("#message");
      const clustersEl = document.querySelector("#clusters");
      const usersEl = document.querySelector("#users");
      const userDetailEl = document.querySelector("#userDetail");
      const adminSummary = document.querySelector("#adminSummary");
      const installCommand = document.querySelector("#installCommand");
      const clusterName = document.querySelector("#clusterName");
      const clusterKind = document.querySelector("#clusterKind");
      const clusterSearch = document.querySelector("#clusterSearch");
      const statusFilter = document.querySelector("#statusFilter");
      const kindFilter = document.querySelector("#kindFilter");

      tokenInput.value = localStorage.getItem("adminToken") || "";

      function adminHeaders() {
        return {
          "Content-Type": "application/json",
          "X-Admin-Token": tokenInput.value.trim(),
        };
      }

      function setMessage(text) {
        message.textContent = text;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            ...adminHeaders(),
            ...(options.headers || {}),
          },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(body.error || `HTTP ${response.status}`);
          error.status = response.status;
          throw error;
        }
        return body;
      }

      function renderClusters(clusters) {
        if (!clusters.length) {
          clustersEl.innerHTML = '<p class="meta">조건에 맞는 클러스터가 없습니다.</p>';
          return;
        }
        clustersEl.innerHTML = clusters.map((cluster) => {
          const status = cluster.status || "active";
          const deletedMeta = status === "deleted"
            ? ` · deleted_at=${escapeHtml(cluster.deleted_at || "-")} · <span class="danger-note">영구 삭제 가능</span>`
            : "";
          const actions = status === "deleted"
            ? `
              <button data-restore="${escapeHtml(cluster.id)}">복원</button>
              <button class="danger" data-purge="${escapeHtml(cluster.id)}">영구 삭제</button>
            `
            : `
              <button data-rotate="${escapeHtml(cluster.id)}">토큰 재발급</button>
              ${
                (cluster.kind || "customer") === "demo"
                  ? `<button data-mark-customer="${escapeHtml(cluster.id)}">사용자 클러스터로 전환</button>`
                  : `<button data-mark-demo="${escapeHtml(cluster.id)}">데모로 분리</button>`
              }
              <button data-disable="${escapeHtml(cluster.id)}">비활성화</button>
              <button class="danger" data-trash="${escapeHtml(cluster.id)}">휴지통</button>
            `;
          return `
            <div class="cluster">
              <strong>${escapeHtml(cluster.name)}</strong>
              <span class="meta">
                id=${escapeHtml(cluster.id)} ·
                owner=${escapeHtml(cluster.user_email || "admin/unassigned")} ·
                kind=${escapeHtml(cluster.kind || "customer")} ·
                status=<span class="status-${escapeHtml(status)}">${escapeHtml(status)}</span> ·
                slack=${cluster.slack_enabled === false ? "off" : "on"} ·
                last_seen=${escapeHtml(cluster.last_seen_at || "-")} ·
                events=${escapeHtml(cluster.event_count || 0)}
                ${deletedMeta}
              </span>
              <div class="actions">${actions}</div>
            </div>
          `;
        }).join("");
      }

      function renderSummary(users, clusters) {
        const totalEvents = clusters.reduce((sum, cluster) => sum + Number(cluster.event_count || 0), 0);
        const activeClusters = clusters.filter((cluster) => cluster.status === "active").length;
        adminSummary.innerHTML = `
          <div class="summary-card"><span class="meta">사용자</span><strong>${users.length}</strong></div>
          <div class="summary-card"><span class="meta">클러스터</span><strong>${clusters.length}</strong></div>
          <div class="summary-card"><span class="meta">활성 클러스터</span><strong>${activeClusters}</strong></div>
          <div class="summary-card"><span class="meta">수집 이벤트</span><strong>${totalEvents}</strong></div>
        `;
      }

      function renderUsers(users) {
        if (!users.length) {
          usersEl.innerHTML = '<p class="meta">등록된 사용자가 없습니다.</p>';
          return;
        }
        usersEl.innerHTML = users.map((user) => {
          return `
            <div class="user">
              <strong>${escapeHtml(user.email)}</strong>
              <span class="meta">
                id=${escapeHtml(user.id)} ·
                provider=${escapeHtml(user.provider)} ·
                name=${escapeHtml(user.name || "-")} ·
                clusters=${escapeHtml(user.cluster_count || 0)} ·
                active=${escapeHtml(user.active_cluster_count || 0)} ·
                disabled=${escapeHtml(user.disabled_cluster_count || 0)} ·
                deleted=${escapeHtml(user.deleted_cluster_count || 0)} ·
                events=${escapeHtml(user.event_count || 0)} ·
                slack=${user.slack_configured ? "configured" : "off"} ·
                last_seen=${escapeHtml(user.last_seen_at || "-")} ·
                last_login=${escapeHtml(user.last_login_at || "-")}
              </span>
              <div class="actions"><button data-user-detail="${escapeHtml(user.id)}">상세 보기</button></div>
            </div>
          `;
        }).join("");
      }

      function renderUserDetail(body) {
        const clusters = body.clusters || [];
        const clusterList = clusters.length
          ? clusters.map((cluster) => `
              <div class="user-cluster">
                <strong>${escapeHtml(cluster.name)}</strong>
                <span class="meta">
                  <span class="pill">${escapeHtml(cluster.status)}</span>
                  kind=${escapeHtml(cluster.kind || "customer")} ·
                  slack=${cluster.slack_enabled === false ? "off" : "on"} ·
                  last_seen=${escapeHtml(cluster.last_seen_at || "-")} ·
                  events=${escapeHtml(cluster.event_count || 0)}
                  ${cluster.status === "deleted" ? ` · deleted_at=${escapeHtml(cluster.deleted_at || "-")}` : ""}
                </span>
              </div>
            `).join("")
          : '<p class="meta">사용자에게 귀속된 클러스터가 없습니다.</p>';
        userDetailEl.innerHTML = `
          <div class="user">
            <strong>${escapeHtml(body.user?.email || "unknown user")}</strong>
            <span class="meta">
              id=${escapeHtml(body.user?.id || "-")} ·
              provider=${escapeHtml(body.user?.provider || "-")} ·
              slack=${body.slack?.configured ? "configured" : "off"}
            </span>
            <div class="user-clusters">${clusterList}</div>
          </div>
        `;
      }

      function clusterListUrl() {
        const params = new URLSearchParams({ include_deleted: "true" });
        if (clusterSearch.value.trim()) {
          params.set("q", clusterSearch.value.trim());
        }
        if (statusFilter.value) {
          params.set("status", statusFilter.value);
        }
        if (kindFilter.value) {
          params.set("kind", kindFilter.value);
        }
        return `/admin/api/clusters?${params.toString()}`;
      }

      async function loadAdminDashboard() {
        const [clusterBody, summaryClusterBody, userBody] = await Promise.all([
          requestJson(clusterListUrl()),
          requestJson("/admin/api/clusters?include_deleted=true"),
          requestJson("/admin/api/users"),
        ]);
        const clusters = clusterBody.clusters || [];
        const summaryClusters = summaryClusterBody.clusters || [];
        const users = userBody.users || [];
        renderSummary(users, summaryClusters);
        renderUsers(users);
        renderClusters(clusters);
        setMessage("관리자 대시보드를 불러왔습니다.");
      }

      document.querySelector("#saveToken").addEventListener("click", () => {
        localStorage.setItem("adminToken", tokenInput.value.trim());
        setMessage("관리자 토큰을 저장했습니다.");
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      document.querySelector("#refreshClusters").addEventListener("click", () => {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      document.querySelector("#applyClusterFilters").addEventListener("click", () => {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      clusterSearch.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          loadAdminDashboard().catch((error) => setMessage(error.message));
        }
      });

      document.querySelector("#createCluster").addEventListener("click", async () => {
        try {
          const body = await requestJson("/admin/api/clusters", {
            method: "POST",
            body: JSON.stringify({ name: clusterName.value, kind: clusterKind.value }),
          });
          installCommand.value = body.cluster.install_command || "";
          clusterName.value = "";
          await loadAdminDashboard();
          setMessage("클러스터를 등록했습니다. 설치 명령어는 지금만 표시됩니다.");
        } catch (error) {
          if (error.status === 409) {
            await loadAdminDashboard().catch(() => {});
          }
          setMessage(error.message);
        }
      });

      clustersEl.addEventListener("click", async (event) => {
        const rotateId = event.target.dataset.rotate;
        const disableId = event.target.dataset.disable;
        const markDemoId = event.target.dataset.markDemo;
        const markCustomerId = event.target.dataset.markCustomer;
        const trashId = event.target.dataset.trash;
        const restoreId = event.target.dataset.restore;
        const purgeId = event.target.dataset.purge;
        try {
          if (rotateId) {
            const body = await requestJson(`/admin/api/clusters/${rotateId}/rotate-token`, { method: "POST" });
            installCommand.value = body.cluster.install_command || "";
            await loadAdminDashboard();
            setMessage("토큰을 재발급했습니다. 설치 명령어는 지금만 표시됩니다.");
          }
          if (markDemoId) {
            await requestJson(`/admin/api/clusters/${markDemoId}/mark-demo`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 데모/테스트 클러스터로 분리했습니다.");
          }
          if (markCustomerId) {
            await requestJson(`/admin/api/clusters/${markCustomerId}/mark-customer`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 사용자 클러스터로 전환했습니다.");
          }
          if (disableId) {
            if (!window.confirm("이 클러스터를 비활성화할까요? 새 이벤트 수집과 정책 적용 흐름이 중단될 수 있습니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${disableId}/disable`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 비활성화했습니다.");
          }
          if (trashId) {
            if (!window.confirm("이 클러스터를 휴지통으로 이동할까요? 토큰은 즉시 폐기됩니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${trashId}`, { method: "DELETE" });
            await loadAdminDashboard();
            setMessage("클러스터를 휴지통으로 이동했습니다.");
          }
          if (restoreId) {
            await requestJson(`/admin/api/clusters/${restoreId}/restore`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 복원했습니다. 사용 전 토큰을 재발급하세요.");
          }
          if (purgeId) {
            if (!window.confirm("삭제된 클러스터를 영구 삭제할까요? 관련 런타임 이벤트와 정책 적용 기록도 삭제됩니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${purgeId}/permanent`, { method: "DELETE" });
            await loadAdminDashboard();
            setMessage("클러스터를 영구 삭제했습니다.");
          }
        } catch (error) {
          setMessage(error.message);
        }
      });

      usersEl.addEventListener("click", async (event) => {
        const userId = event.target.dataset.userDetail;
        if (!userId) {
          return;
        }
        try {
          const body = await requestJson(`/admin/api/users/${userId}/clusters`);
          renderUserDetail(body);
          setMessage("사용자 상세를 불러왔습니다.");
        } catch (error) {
          setMessage(error.message);
        }
      });

      document.querySelector("#copyInstall").addEventListener("click", async () => {
        await navigator.clipboard.writeText(installCommand.value);
        setMessage("설치 명령어를 복사했습니다.");
      });

      if (tokenInput.value.trim()) {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      }
    </script>
  </body>
</html>
