<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KubeOwl Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ecfbff;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-strong: #ffffff;
        --line: rgba(8, 119, 242, 0.18);
        --line-strong: rgba(8, 119, 242, 0.32);
        --text: #1f2937;
        --muted: #5f6b7a;
        --accent: #0877f2;
        --accent-2: #56ccf2;
        --danger: #cf222e;
        --soft: #f4fbff;
        --code: #08111f;
        --shadow: 0 22px 60px rgba(8, 119, 242, 0.11);
        --shadow-soft: 0 12px 28px rgba(15, 23, 42, 0.07);
      }
      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #08111f;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-strong: #111827;
        --line: rgba(125, 211, 252, 0.2);
        --line-strong: rgba(125, 211, 252, 0.34);
        --text: #e5edf6;
        --muted: #a8b3c4;
        --accent: #60a5fa;
        --accent-2: #38bdf8;
        --danger: #f87171;
        --soft: #111827;
        --code: #050b16;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
        --shadow-soft: 0 12px 28px rgba(0, 0, 0, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: SUIT, Pretendard, "Noto Sans KR", ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% -10%, rgba(86, 204, 242, 0.38), transparent 34%),
          linear-gradient(135deg, #f8fdff 0%, #e7faff 48%, #d8f3ff 100%);
        color: var(--text);
      }
      body[data-theme="dark"] {
        background:
          radial-gradient(circle at 18% -10%, rgba(56, 189, 248, 0.22), transparent 34%),
          linear-gradient(135deg, #050b16 0%, #08111f 48%, #0d2744 100%);
      }
      header {
        position: relative;
        overflow: hidden;
        margin: 24px 32px 0;
        padding: 28px 32px;
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 18px;
        background:
          radial-gradient(circle at 80% 10%, rgba(86, 204, 242, 0.45), transparent 30%),
          linear-gradient(135deg, #07306f, #0877f2 58%, #08aeea);
        color: #ffffff;
        box-shadow: 0 26px 70px rgba(8, 119, 242, 0.24);
      }
      header::after {
        content: "";
        position: absolute;
        inset: auto -60px -100px auto;
        width: 260px;
        height: 260px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }
      .admin-topline {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .admin-title-block {
        min-width: 0;
      }
      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 122px;
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        backdrop-filter: blur(16px);
      }
      .theme-switch {
        position: relative;
        width: 42px;
        height: 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
      }
      .theme-switch::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: #ffffff;
        transition: transform 0.18s ease;
      }
      body[data-theme="dark"] .theme-switch::after {
        transform: translateX(18px);
      }
      main {
        display: grid;
        gap: 20px;
        padding: 24px 32px 48px;
      }
      .admin-overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.55fr);
        gap: 20px;
        align-items: stretch;
      }
      section {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        padding: 22px;
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(18px);
      }
      body[data-theme="dark"] section {
        background: var(--panel);
      }
      h1, h2 {
        margin: 0;
      }
      h1 {
        position: relative;
        z-index: 1;
        font-size: clamp(30px, 4vw, 42px);
        letter-spacing: -0.04em;
      }
      header p {
        position: relative;
        z-index: 1;
        max-width: 620px;
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-weight: 720;
      }
      h2 {
        margin-bottom: 16px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .admin-grafana-card {
        position: relative;
        overflow: hidden;
        display: grid;
        align-content: space-between;
        gap: 18px;
        min-height: 192px;
      }
      .admin-grafana-card::after {
        content: "";
        position: absolute;
        inset: auto -48px -68px auto;
        width: 180px;
        height: 180px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(251, 146, 60, 0.2), transparent 62%);
        pointer-events: none;
      }
      .admin-grafana-heading {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .admin-grafana-heading h2 {
        margin-bottom: 4px;
      }
      .admin-grafana-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-weight: 720;
      }
      .admin-grafana-links {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 10px;
      }
      .admin-grafana-link {
        display: grid;
        gap: 4px;
        width: 100%;
        padding: 12px 14px;
        text-align: left;
      }
      .admin-grafana-link strong {
        color: inherit;
      }
      .admin-grafana-link span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }
      .admin-grafana-logo {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background:
          radial-gradient(circle at 55% 58%, rgba(255, 255, 255, 0.9) 0 12%, transparent 13%),
          linear-gradient(135deg, #ffb020, #f15b2a);
        box-shadow: 0 16px 34px rgba(241, 91, 42, 0.24);
      }
      .admin-grafana-logo svg {
        width: 34px;
        height: 34px;
      }
      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-weight: 820;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        padding: 13px 14px;
        font: inherit;
        font-weight: 760;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
      }
      body[data-theme="dark"] input,
      body[data-theme="dark"] select {
        background: #08111f;
        color: var(--text);
        box-shadow: none;
      }
      input:focus, select:focus, textarea:focus {
        outline: 3px solid rgba(8, 119, 242, 0.16);
        border-color: var(--accent);
      }
      textarea {
        min-height: 220px;
        border-color: rgba(125, 211, 252, 0.24);
        background: var(--code);
        color: #dbeafe;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        resize: vertical;
      }
      button {
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--text);
        padding: 11px 15px;
        font-weight: 880;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }
      body[data-theme="dark"] button {
        background: rgba(15, 23, 42, 0.86);
        color: var(--text);
      }
      button:hover {
        transform: translateY(-1px);
        border-color: rgba(8, 119, 242, 0.48);
        box-shadow: 0 12px 24px rgba(8, 119, 242, 0.12);
      }
      button.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), #0ea5e9);
        color: #ffffff;
        box-shadow: 0 14px 28px rgba(8, 119, 242, 0.22);
      }
      button.danger {
        border-color: rgba(207, 34, 46, 0.34);
        background: rgba(207, 34, 46, 0.08);
        color: var(--danger);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      .row label {
        flex: 1 1 280px;
      }
      .cluster, .user {
        display: grid;
        gap: 12px;
        margin-top: 12px;
        border: 1px solid rgba(8, 119, 242, 0.16);
        border-radius: 12px;
        background:
          radial-gradient(circle at 0% 0%, rgba(86, 204, 242, 0.12), transparent 28%),
          rgba(255, 255, 255, 0.72);
        padding: 16px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      }
      body[data-theme="dark"] .cluster,
      body[data-theme="dark"] .user {
        background:
          radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1), transparent 28%),
          rgba(15, 23, 42, 0.76);
      }
      .cluster:first-child,
      .user:first-child {
        margin-top: 0;
      }
      .cluster strong,
      .user strong {
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .summary-card {
        border: 1px solid rgba(8, 119, 242, 0.18);
        border-radius: 13px;
        background:
          radial-gradient(circle at 18% 0%, rgba(86, 204, 242, 0.22), transparent 34%),
          linear-gradient(180deg, #ffffff, #f5fcff);
        padding: 16px;
      }
      body[data-theme="dark"] .summary-card {
        background:
          radial-gradient(circle at 18% 0%, rgba(56, 189, 248, 0.16), transparent 34%),
          linear-gradient(180deg, #111827, #0f172a);
      }
      body[data-theme="dark"] .summary-card strong {
        color: #f8fafc;
      }
      .summary-card strong {
        display: block;
        margin-top: 6px;
        color: #0f172a;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      .user-clusters {
        display: grid;
        gap: 10px;
      }
      .user-cluster {
        border: 1px solid rgba(8, 119, 242, 0.16);
        border-radius: 11px;
        background: #f8fdff;
        padding: 12px 14px;
      }
      body[data-theme="dark"] .user-cluster {
        background: #08111f;
      }
      .meta {
        color: var(--muted);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(8, 119, 242, 0.22);
        border-radius: 999px;
        background: rgba(8, 119, 242, 0.08);
        padding: 4px 10px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 860;
      }
      .status-active {
        color: #128a3d;
        font-weight: 860;
      }
      .status-disabled {
        color: var(--danger);
        font-weight: 860;
      }
      .status-deleted {
        color: #b7791f;
        font-weight: 860;
      }
      .filters {
        display: grid;
        grid-template-columns: minmax(240px, 2fr) minmax(150px, 0.65fr) auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid rgba(8, 119, 242, 0.14);
        border-radius: 12px;
        background: rgba(244, 251, 255, 0.7);
      }
      body[data-theme="dark"] .filters {
        background: rgba(15, 23, 42, 0.62);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .actions button {
        padding: 9px 13px;
        border-radius: 9px;
      }
      .danger-note {
        color: #b45309;
        font-weight: 820;
      }
      #message {
        min-height: 24px;
        margin-bottom: 0;
        color: var(--muted);
        font-weight: 760;
      }
      @media (max-width: 900px) {
        header,
        main {
          margin-left: 16px;
          margin-right: 16px;
          padding-left: 18px;
          padding-right: 18px;
        }
        main {
          margin: 0;
        }
        .admin-overview-grid {
          grid-template-columns: 1fr;
        }
        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        header {
          margin: 16px 12px 0;
        }
        main {
          padding: 16px 12px 36px;
        }
        .summary-grid,
        .filters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="admin-topline">
        <div class="admin-title-block">
          <h1>KubeOwl Admin</h1>
          <p>클러스터 토큰, 사용자 상태, 수집 이벤트를 한 곳에서 점검하는 운영자 콘솔입니다.</p>
        </div>
        <button class="theme-toggle" id="adminThemeToggle" type="button" aria-pressed="false">
          <span id="adminThemeLabel">Dark</span>
          <span class="theme-switch" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main>
      <div class="admin-overview-grid">
        <section>
          <h2>Admin Token</h2>
          <div class="row">
            <label>
              X-Admin-Token
              <input id="adminToken" type="password" autocomplete="off" />
            </label>
            <button class="primary" id="saveToken">저장</button>
            <button id="refreshClusters">새로고침</button>
          </div>
          <p id="message"></p>
        </section>

        <section class="admin-grafana-card">
          <div class="admin-grafana-heading">
            <span class="admin-grafana-logo" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img" aria-label="Grafana logo">
                <path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M31.5 28.5c0 4.1-3.4 7.5-7.5 7.5s-7.5-3.4-7.5-7.5S19.9 21 24 21c2 0 3.8.8 5.1 2.1" />
                <path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M34.5 21.5c-2.1-4.1-6.3-6.9-11.2-6.9c-7 0-12.7 5.7-12.7 12.7c0 2.8.9 5.3 2.5 7.4m21.4-13.2l-5.7 1.7l1.8-5.7" />
              </svg>
            </span>
            <div>
              <h2>Admin Grafana</h2>
              <p>관리자 클러스터와 연결된 마스터 Grafana에서 전체 수집 상태와 운영 지표를 확인합니다.</p>
            </div>
          </div>
          <div class="admin-grafana-links" id="adminGrafanaLinks">
            <button class="primary admin-grafana-link" data-grafana-link="default">
              <strong>전체 Grafana 열기</strong>
              <span>관리자 org의 대시보드 목록으로 이동합니다.</span>
            </button>
          </div>
        </section>
      </div>

      <section>
        <h2>운영 요약</h2>
        <div class="summary-grid" id="adminSummary">
          <div class="summary-card"><span class="meta">사용자</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">클러스터</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">활성 클러스터</span><strong>-</strong></div>
          <div class="summary-card"><span class="meta">수집 이벤트</span><strong>-</strong></div>
        </div>
      </section>

      <section>
        <h2>사용자 목록</h2>
        <div id="users"></div>
      </section>

      <section>
        <h2>사용자 상세</h2>
        <div id="userDetail"><p class="meta">사용자를 선택하면 소유 클러스터, 이벤트 수, Slack 설정 상태를 확인할 수 있습니다.</p></div>
      </section>

      <section>
        <h2>클러스터 목록</h2>
        <div class="filters">
          <label>
            검색
            <input id="clusterSearch" placeholder="email, cluster, status, last_seen" />
          </label>
          <label>
            상태
            <select id="statusFilter">
              <option value="">전체</option>
              <option value="active">active</option>
              <option value="disabled">disabled</option>
              <option value="deleted">deleted</option>
            </select>
          </label>
          <button id="applyClusterFilters">필터 적용</button>
        </div>
        <div id="clusters"></div>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#adminToken");
      const message = document.querySelector("#message");
      const clustersEl = document.querySelector("#clusters");
      const usersEl = document.querySelector("#users");
      const userDetailEl = document.querySelector("#userDetail");
      const adminSummary = document.querySelector("#adminSummary");
      const clusterSearch = document.querySelector("#clusterSearch");
      const statusFilter = document.querySelector("#statusFilter");
      const adminThemeToggle = document.querySelector("#adminThemeToggle");
      const adminThemeLabel = document.querySelector("#adminThemeLabel");
      let currentUserDetailId = "";

      tokenInput.value = localStorage.getItem("adminToken") || "";
      const savedTheme = localStorage.getItem("adminTheme") || "light";
      document.body.dataset.theme = savedTheme;
      adminThemeToggle.setAttribute("aria-pressed", savedTheme === "dark" ? "true" : "false");
      adminThemeLabel.textContent = savedTheme === "dark" ? "Light" : "Dark";

      function adminHeaders() {
        return {
          "Content-Type": "application/json",
          "X-Admin-Token": tokenInput.value.trim(),
        };
      }

      function setMessage(text) {
        message.textContent = text;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            ...adminHeaders(),
            ...(options.headers || {}),
          },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(body.error || `HTTP ${response.status}`);
          error.status = response.status;
          throw error;
        }
        return body;
      }

      function displayClusterStatus(status) {
        const labels = {
          active: "활성",
          disabled: "비활성",
          deleted: "휴지통",
        };
        return labels[status] || status;
      }

      function displayUserStatus(status) {
        const labels = {
          active: "활성",
          disabled: "비활성",
          deleted: "삭제됨",
        };
        return labels[status] || status;
      }

      function renderClusters(clusters) {
        if (!clusters.length) {
          clustersEl.innerHTML = '<p class="meta">조건에 맞는 클러스터가 없습니다.</p>';
          return;
        }
        clustersEl.innerHTML = clusters.map((cluster) => {
          const status = cluster.status || "active";
          const deletedMeta = status === "deleted"
            ? ` · deleted_at=${escapeHtml(cluster.deleted_at || "-")} · <span class="danger-note">영구 삭제 가능</span>`
            : "";
          const actions = status === "deleted"
            ? `
              <button data-restore="${escapeHtml(cluster.id)}">복원</button>
              <button class="danger" data-purge="${escapeHtml(cluster.id)}">영구 삭제</button>
            `
            : `
              <button data-rotate="${escapeHtml(cluster.id)}">토큰 재발급</button>
              <button data-disable="${escapeHtml(cluster.id)}">비활성화</button>
              <button class="danger" data-trash="${escapeHtml(cluster.id)}">휴지통</button>
            `;
          return `
            <div class="cluster">
              <strong>${escapeHtml(cluster.name)}</strong>
              <span class="meta">
                id=${escapeHtml(cluster.id)} ·
                owner=${escapeHtml(cluster.user_email || "admin/unassigned")} ·
                status=<span class="status-${escapeHtml(status)}">${escapeHtml(displayClusterStatus(status))}</span> ·
                slack=${cluster.slack_enabled === false ? "off" : "on"} ·
                last_seen=${escapeHtml(cluster.last_seen_at || "-")} ·
                events=${escapeHtml(cluster.event_count || 0)}
                ${deletedMeta}
              </span>
              <div class="actions">${actions}</div>
            </div>
          `;
        }).join("");
      }

      function renderSummary(users, clusters) {
        const totalEvents = clusters.reduce((sum, cluster) => sum + Number(cluster.event_count || 0), 0);
        const activeClusters = clusters.filter((cluster) => cluster.status === "active").length;
        adminSummary.innerHTML = `
          <div class="summary-card"><span class="meta">사용자</span><strong>${users.length}</strong></div>
          <div class="summary-card"><span class="meta">클러스터</span><strong>${clusters.length}</strong></div>
          <div class="summary-card"><span class="meta">활성 클러스터</span><strong>${activeClusters}</strong></div>
          <div class="summary-card"><span class="meta">수집 이벤트</span><strong>${totalEvents}</strong></div>
        `;
      }

      function renderUsers(users) {
        if (!users.length) {
          usersEl.innerHTML = '<p class="meta">등록된 사용자가 없습니다.</p>';
          return;
        }
        usersEl.innerHTML = users.map((user) => {
          const status = user.status || "active";
          const deletedMeta = status === "deleted"
            ? ` · deleted_at=${escapeHtml(user.deleted_at || "-")}`
            : "";
          return `
            <div class="user">
              <strong>${escapeHtml(user.email)}</strong>
              <span class="meta">
                id=${escapeHtml(user.id)} ·
                provider=${escapeHtml(user.provider)} ·
                name=${escapeHtml(user.name || "-")} ·
                status=<span class="status-${escapeHtml(status)}">${escapeHtml(displayUserStatus(status))}</span> ·
                clusters=${escapeHtml(user.cluster_count || 0)} ·
                active=${escapeHtml(user.active_cluster_count || 0)} ·
                disabled=${escapeHtml(user.disabled_cluster_count || 0)} ·
                deleted=${escapeHtml(user.deleted_cluster_count || 0)} ·
                events=${escapeHtml(user.event_count || 0)} ·
                slack=${user.slack_configured ? "configured" : "off"} ·
                last_seen=${escapeHtml(user.last_seen_at || "-")} ·
                last_login=${escapeHtml(user.last_login_at || "-")}
                ${deletedMeta}
              </span>
              <div class="actions"><button data-user-detail="${escapeHtml(user.id)}">상세 보기</button></div>
            </div>
          `;
        }).join("");
      }

      function renderUserDetail(body) {
        const clusters = body.clusters || [];
        currentUserDetailId = body.user?.id || "";
        const status = body.user?.status || "active";
        const deletedAt = body.user?.deleted_at || "";
        const totalEvents = clusters.reduce((sum, cluster) => sum + Number(cluster.event_count || 0), 0);
        const clusterList = clusters.length
          ? clusters.map((cluster) => `
              <div class="user-cluster">
                <strong>${escapeHtml(cluster.name)}</strong>
                <span class="meta">
                  <span class="pill">${escapeHtml(displayClusterStatus(cluster.status || "active"))}</span>
                  slack=${cluster.slack_enabled === false ? "off" : "on"} ·
                  last_seen=${escapeHtml(cluster.last_seen_at || "-")} ·
                  events=${escapeHtml(cluster.event_count || 0)}
                  ${cluster.status === "deleted" ? ` · deleted_at=${escapeHtml(cluster.deleted_at || "-")}` : ""}
                </span>
              </div>
            `).join("")
          : '<p class="meta">사용자에게 귀속된 클러스터가 없습니다.</p>';
        const restoreAction = status === "deleted"
          ? `<button class="primary" data-user-restore="${escapeHtml(body.user?.id || "")}">계정 복구</button>`
          : "";
        userDetailEl.innerHTML = `
          <div class="user">
            <strong>${escapeHtml(body.user?.email || "unknown user")}</strong>
            <span class="meta">
              id=${escapeHtml(body.user?.id || "-")} ·
              provider=${escapeHtml(body.user?.provider || "-")} ·
              status=<span class="status-${escapeHtml(status)}">${escapeHtml(displayUserStatus(status))}</span> ·
              slack=${body.slack?.configured ? "configured" : "off"} ·
              clusters=${escapeHtml(clusters.length)} ·
              events=${escapeHtml(totalEvents)}
              ${deletedAt ? ` · deleted_at=${escapeHtml(deletedAt)}` : ""}
            </span>
            ${status === "deleted" ? '<p class="meta">삭제된 계정입니다. 세션과 클러스터 토큰은 무효화되며, 이벤트와 정책 기록은 감사 목적으로 보존됩니다.</p>' : ""}
            <div class="user-clusters">${clusterList}</div>
            <div class="actions user-detail-actions">${restoreAction}</div>
          </div>
        `;
      }

      function clusterListUrl() {
        const params = new URLSearchParams({ include_deleted: "true" });
        if (clusterSearch.value.trim()) {
          params.set("q", clusterSearch.value.trim());
        }
        if (statusFilter.value) {
          params.set("status", statusFilter.value);
        }
        return `/admin/api/clusters?${params.toString()}`;
      }

      async function loadAdminDashboard() {
        const [clusterBody, summaryClusterBody, userBody] = await Promise.all([
          requestJson(clusterListUrl()),
          requestJson("/admin/api/clusters?include_deleted=true"),
          requestJson("/admin/api/users"),
        ]);
        const clusters = clusterBody.clusters || [];
        const summaryClusters = summaryClusterBody.clusters || [];
        const users = userBody.users || [];
        renderSummary(users, summaryClusters);
        renderUsers(users);
        renderClusters(clusters);
        setMessage("관리자 대시보드를 불러왔습니다.");
      }

      document.querySelector("#saveToken").addEventListener("click", () => {
        localStorage.setItem("adminToken", tokenInput.value.trim());
        setMessage("관리자 토큰을 저장했습니다.");
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      document.querySelector("#refreshClusters").addEventListener("click", () => {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      document.querySelector("#applyClusterFilters").addEventListener("click", () => {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      });

      function renderAdminGrafanaLinks(links) {
        const container = document.querySelector("#adminGrafanaLinks");
        const safeLinks = Array.isArray(links) && links.length ? links : [];
        container.innerHTML = safeLinks
          .map((link, index) => `
            <button class="${index === 0 ? "primary" : ""} admin-grafana-link" data-grafana-link="${index}">
              <strong>${escapeHtml(link.label || "Grafana 열기")}</strong>
              <span>${escapeHtml(link.description || link.url || "")}</span>
            </button>
          `)
          .join("");
      }

      async function openAdminGrafana(linkIndex = 0) {
        const grafanaWindow = window.open("about:blank", "_blank");
        if (grafanaWindow) {
          grafanaWindow.opener = null;
        }
        try {
          const body = await requestJson("/admin/api/grafana/url");
          renderAdminGrafanaLinks(body.grafana?.links);
          const links = Array.isArray(body.grafana?.links) ? body.grafana.links : [];
          const url = links[linkIndex]?.url || body.grafana?.url || "";
          if (!url) {
            throw new Error("Grafana URL이 비어 있습니다.");
          }
          if (grafanaWindow) {
            grafanaWindow.location.href = url;
          } else {
            window.location.href = url;
          }
          setMessage("Admin Grafana를 열었습니다.");
        } catch (error) {
          grafanaWindow?.close();
          setMessage(error.message);
        }
      }

      document.querySelector("#adminGrafanaLinks").addEventListener("click", (event) => {
        const button = event.target.closest("[data-grafana-link]");
        if (!button) {
          return;
        }
        const linkIndex = Number.parseInt(button.dataset.grafanaLink || "0", 10);
        openAdminGrafana(Number.isNaN(linkIndex) ? 0 : linkIndex);
      });

      clusterSearch.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          loadAdminDashboard().catch((error) => setMessage(error.message));
        }
      });

      clustersEl.addEventListener("click", async (event) => {
        const rotateId = event.target.dataset.rotate;
        const disableId = event.target.dataset.disable;
        const trashId = event.target.dataset.trash;
        const restoreId = event.target.dataset.restore;
        const purgeId = event.target.dataset.purge;
        try {
          if (rotateId) {
            await requestJson(`/admin/api/clusters/${rotateId}/rotate-token`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("토큰을 재발급했습니다. 새 설치 명령은 사용자 Cluster Setup에서 확인하세요.");
          }
          if (disableId) {
            if (!window.confirm("이 클러스터를 비활성화할까요? 새 이벤트 수집과 정책 적용 흐름이 중단될 수 있습니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${disableId}/disable`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 비활성화했습니다.");
          }
          if (trashId) {
            if (!window.confirm("이 클러스터를 휴지통으로 이동할까요? 토큰은 즉시 폐기됩니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${trashId}`, { method: "DELETE" });
            await loadAdminDashboard();
            setMessage("클러스터를 휴지통으로 이동했습니다.");
          }
          if (restoreId) {
            await requestJson(`/admin/api/clusters/${restoreId}/restore`, { method: "POST" });
            await loadAdminDashboard();
            setMessage("클러스터를 복원했습니다. 사용 전 토큰을 재발급하세요.");
          }
          if (purgeId) {
            if (!window.confirm("삭제된 클러스터를 영구 삭제할까요? 관련 런타임 이벤트와 정책 적용 기록도 삭제됩니다.")) {
              return;
            }
            await requestJson(`/admin/api/clusters/${purgeId}/permanent`, { method: "DELETE" });
            await loadAdminDashboard();
            setMessage("클러스터를 영구 삭제했습니다.");
          }
        } catch (error) {
          setMessage(error.message);
        }
      });

      usersEl.addEventListener("click", async (event) => {
        const userId = event.target.dataset.userDetail;
        if (!userId) {
          return;
        }
        try {
          const body = await requestJson(`/admin/api/users/${userId}/clusters`);
          renderUserDetail(body);
          setMessage("사용자 상세를 불러왔습니다.");
        } catch (error) {
          setMessage(error.message);
        }
      });

      userDetailEl.addEventListener("click", async (event) => {
        const restoreId = event.target.dataset.userRestore;
        if (!restoreId) {
          return;
        }
        try {
          await requestJson(`/admin/api/users/${restoreId}/restore`, { method: "POST" });
          await loadAdminDashboard();
          if (currentUserDetailId === restoreId) {
            const body = await requestJson(`/admin/api/users/${restoreId}/clusters`);
            renderUserDetail(body);
          }
          setMessage("사용자 계정을 복구했습니다.");
        } catch (error) {
          setMessage(error.message);
        }
      });

      adminThemeToggle.addEventListener("click", () => {
        const nextTheme = document.body.dataset.theme === "dark" ? "light" : "dark";
        document.body.dataset.theme = nextTheme;
        localStorage.setItem("adminTheme", nextTheme);
        adminThemeToggle.setAttribute("aria-pressed", nextTheme === "dark" ? "true" : "false");
        adminThemeLabel.textContent = nextTheme === "dark" ? "Light" : "Dark";
      });

      if (tokenInput.value.trim()) {
        loadAdminDashboard().catch((error) => setMessage(error.message));
      }
    </script>
  </body>
</html>
