apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-platform-admin-folder-permissions
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: compliance-platform
    app.kubernetes.io/component: grafana-permissions
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: compliance-platform
        app.kubernetes.io/component: grafana-permissions
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-permissions
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: GRAFANA_URL
              value: http://grafana.monitoring.svc:3000
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-user
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: KUBEOWL_GRAFANA_ADMIN_EMAIL
              value: kubeowl-admin@local
            - name: KUBEOWL_GRAFANA_ADMIN_NAME
              value: KubeOwl Admin
            - name: KUBEOWL_ADMIN_FOLDER_UID
              value: kubeowl-admin
            - name: KUBEOWL_ADMIN_FOLDER_TITLE
              value: KubeOwl Admin
          command:
            - python
            - -c
            - |
              import base64
              import json
              import os
              import time
              import urllib.error
              import urllib.parse
              import urllib.request
              import uuid

              grafana_url = os.environ["GRAFANA_URL"].rstrip("/")
              admin_user = os.environ["GRAFANA_ADMIN_USER"]
              admin_password = os.environ["GRAFANA_ADMIN_PASSWORD"]
              admin_email = os.environ["KUBEOWL_GRAFANA_ADMIN_EMAIL"]
              admin_name = os.environ["KUBEOWL_GRAFANA_ADMIN_NAME"]
              folder_uid = os.environ["KUBEOWL_ADMIN_FOLDER_UID"]
              folder_title = os.environ["KUBEOWL_ADMIN_FOLDER_TITLE"]
              auth = base64.b64encode(f"{admin_user}:{admin_password}".encode()).decode()

              def request(method, path, body=None, expected=(200,)):
                  data = None
                  headers = {
                      "Authorization": f"Basic {auth}",
                      "Accept": "application/json",
                  }
                  if body is not None:
                      data = json.dumps(body).encode()
                      headers["Content-Type"] = "application/json"
                  req = urllib.request.Request(
                      f"{grafana_url}{path}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          payload = resp.read().decode()
                          if resp.status not in expected:
                              raise RuntimeError(f"{method} {path} returned {resp.status}: {payload}")
                          return json.loads(payload) if payload else {}
                  except urllib.error.HTTPError as exc:
                      payload = exc.read().decode()
                      if exc.code in expected:
                          return json.loads(payload) if payload else {}
                      raise RuntimeError(f"{method} {path} returned {exc.code}: {payload}") from exc

              for _ in range(60):
                  try:
                      request("GET", "/api/health")
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise RuntimeError("Grafana did not become ready")

              try:
                  user = request("GET", f"/api/users/lookup?loginOrEmail={admin_email}")
              except RuntimeError as exc:
                  if " returned 404:" not in str(exc):
                      raise
                  user = request(
                      "POST",
                      "/api/admin/users",
                      {
                          "name": admin_name,
                          "email": admin_email,
                          "login": admin_email,
                          "password": str(uuid.uuid4()),
                      },
                      expected=(200,),
                  )

              user_id = user["id"]
              request("PATCH", f"/api/orgs/1/users/{user_id}", {"role": "Admin"})

              try:
                  request("GET", f"/api/folders/{folder_uid}")
              except RuntimeError as exc:
                  if " returned 404:" not in str(exc):
                      raise
                  query = urllib.parse.quote(folder_title)
                  folders = request("GET", f"/api/search?type=dash-folder&query={query}")
                  match = next((folder for folder in folders if folder.get("title") == folder_title), None)
                  if match:
                      folder_uid = match["uid"]
                  else:
                      request(
                          "POST",
                          "/api/folders",
                          {
                              "uid": folder_uid,
                              "title": folder_title,
                          },
                      )

              request(
                  "POST",
                  f"/api/folders/{folder_uid}/permissions",
                  [
                      {
                          "role": "Admin",
                          "permission": 4,
                      }
                  ],
              )
              print(f"Applied Admin-only permissions to Grafana folder {folder_uid}")
