apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeowl-console
  namespace: compliance-system
  labels:
    app: ai-classifier
    app.kubernetes.io/part-of: compliance-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: kubeowl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-classifier
                port:
                  number: 8000
          - path: /grafana-ui
            pathType: Prefix
            backend:
              service:
                name: ai-classifier
                port:
                  number: 8000
          - path: /admin-grafana
            pathType: Prefix
            backend:
              service:
                name: ai-classifier
                port:
                  number: 8000
